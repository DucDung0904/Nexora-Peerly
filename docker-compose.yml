name: nexory-peerly

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: UTC
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432"
    volumes:
      - peerly_postgres:/var/lib/postgresql
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../Nexora_Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-local-development-turn-secret-change-before-deploy}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      turn:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 10

  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --realm=nexory-peerly.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-development-turn-secret-change-before-deploy}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  peerly_postgres:
